<html lang="en">

<title>Link report</title>
<h1>Link report</h1>

<script>
// Reports often link the preview by localhost while the viewer frames 127.0.0.1.
document.getElementById("local").href =
  location.origin.replace("127.0.0.1", "localhost") + "/files/older.html";
</script>
</html>
